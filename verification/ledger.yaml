# ledger.yaml — the verification standard (PLAN.md Section 1).
#
# Passing tests is necessary, not sufficient. A metric or feature is *done*
# only when its row here is complete, every criterion has an evidence pointer
# (a test name, a result file, or a PROGRESS.md entry), and
# `scripts/verification/render_ledger.py` confirms that evidence exists.
# The rendered results/verification/VERIFICATION.md is what the maintainer reads.
#
# Evidence values are one of:
#   tests/test_embeddings/test_weat.py::TestWEAT::test_caliskan_table1   a test
#   results/verification/weat/gpt2.json                                  a file
#   PROGRESS.md#2026-09-03                                               a note
#   exempt: <reason>          a criterion the metric cannot satisfy by design
#
# An empty string means not yet done. Do not fill a cell without the evidence.

