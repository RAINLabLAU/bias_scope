[project]
name = "bias-scope"
version = "0.1.1"
description = "A library for detecting biases in machine learning models."
authors = [
    {name = "ChadiHelwe", email = "chadi.helwe@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["bias", "fairness", "language-models", "machine-learning", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.1.3",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/RAINLabLAU/bias_scope"
Documentation = "https://github.com/RAINLabLAU/bias_scope/tree/main/docs"
Repository = "https://github.com/RAINLabLAU/bias_scope"
Issues = "https://github.com/RAINLabLAU/bias_scope/issues"

[project.optional-dependencies]
torch = [
    "torch>=2.5.1",
    "transformers>=4.31.0",
    "accelerate>=0.26.0",
]
embeddings = [
    "sentence-transformers>=2.0.0",
]
datasets = [
    "datasets>=2.0.0",
]
llm = [
    "litellm>=1.0.0",
]
perspective = [
    "google-api-python-client>=2.0.0",
]
viz = [
    "matplotlib>=3.7.0",
]

all = [
    "matplotlib>=3.7.0",
    "torch>=2.5.1",
    "transformers>=4.31.0",
    "accelerate>=0.26.0",
    "sentence-transformers>=2.0.0",
    "datasets>=2.0.0",
    "litellm>=1.0.0",
    "google-api-python-client>=2.0.0",
]

dev = [
    "build>=1.2.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0",
    "pypdf>=4.0.0",
    "fairlearn>=0.10.0",
    "hatchling>=1.25.0",
    "isort>=5.13.2",
    "pytest>=9.0.0",
    "twine>=5.0.0",
    "coverage>=7.6.4",
    "black>=26.1.0",
    "nox>=2025.11.12",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bias_scope"]

[tool.hatch.build.targets.wheel.force-include]
"src/bias_scope/prompts_based/sycon_table2_targets.json" = "bias_scope/prompts_based/sycon_table2_targets.json"
"src/bias_scope/prompts_based/realtoxicityprompts_targets.json" = "bias_scope/prompts_based/realtoxicityprompts_targets.json"
"src/bias_scope/prompts_based/truthfulqa_targets.json" = "bias_scope/prompts_based/truthfulqa_targets.json"
"src/bias_scope/prompts_based/stereoset_targets.json" = "bias_scope/prompts_based/stereoset_targets.json"
"src/bias_scope/prompts_based/bold_targets.json" = "bias_scope/prompts_based/bold_targets.json"
"src/bias_scope/prompts_based/bbq_targets.json" = "bias_scope/prompts_based/bbq_targets.json"

[tool.hatch.build.targets.sdist.force-include]
"src/bias_scope/prompts_based/sycon_table2_targets.json" = "src/bias_scope/prompts_based/sycon_table2_targets.json"
"src/bias_scope/prompts_based/realtoxicityprompts_targets.json" = "src/bias_scope/prompts_based/realtoxicityprompts_targets.json"
"src/bias_scope/prompts_based/truthfulqa_targets.json" = "src/bias_scope/prompts_based/truthfulqa_targets.json"
"src/bias_scope/prompts_based/stereoset_targets.json" = "src/bias_scope/prompts_based/stereoset_targets.json"
"src/bias_scope/prompts_based/bold_targets.json" = "src/bias_scope/prompts_based/bold_targets.json"
"src/bias_scope/prompts_based/bbq_targets.json" = "src/bias_scope/prompts_based/bbq_targets.json"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
source = ["bias_scope", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not slow and not equivalence'"
markers = [
    "slow: takes more than a few seconds; excluded from the fast suite",
    "equivalence: Tier-2 reference-implementation comparison; needs BIASSCOPE_RUN_EQUIVALENCE=1",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ imports after try/except stubs on purpose, so that
# optional torch/embedding extras degrade to a clear ImportError at call time.
"src/bias_scope/__init__.py" = ["E402"]
# Same pattern: metric imports are interleaved with try/except stubs so the
# optional torch extra degrades to a clear ImportError at construction time.
"src/bias_scope/probability_based/__init__.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10
